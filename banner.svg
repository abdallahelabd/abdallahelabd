<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="title desc">
  <title id="title">Abdallah Elabd</title>
  <desc id="desc">A terminal window: whoami prints Abdallah Elabd, freelance programmer since 2020 and founder of 5+ startups. Then: open abdallah.cv</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#042f1d"/>
      <stop offset="100%" stop-color="#010d04"/>
    </radialGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .prompt { fill: #16a34a; font-size: 24px; }
      .cmd { fill: #4ade80; }
      .name { fill: #bbf7d0; font-size: 56px; font-weight: 700; }
      .line { fill: #4ade80; font-size: 24px; }
      .muted { fill: #15803d; font-size: 20px; }
      .reveal { opacity: 0; animation: show 0.01s forwards; }
      .l1 { animation-delay: 0.3s; }
      .l2 { animation-delay: 0.9s; }
      .l3 { animation-delay: 1.5s; }
      .l4 { animation-delay: 2.0s; }
      .l5 { animation-delay: 2.7s; }
      .cursor { fill: #4ade80; animation: blink 1s steps(2, start) 2.7s infinite; }
      @keyframes show { to { opacity: 1; } }
      @keyframes blink { to { visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        .reveal { animation: none; opacity: 1; }
        .cursor { animation: none; }
      }
    </style>
  </defs>
  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect x="24" y="20" width="1152" height="340" rx="16" fill="#000" stroke="#15803d" stroke-width="2"/>
  <circle cx="58" cy="52" r="7" fill="#14532d"/>
  <circle cx="82" cy="52" r="7" fill="#14532d"/>
  <circle cx="106" cy="52" r="7" fill="#14532d"/>
  <text x="1150" y="58" text-anchor="end" class="mono muted">abdallah.cv</text>

  <g class="mono">
    <text x="64" y="110" class="prompt reveal l1">$ <tspan class="cmd">whoami</tspan></text>
    <text x="64" y="180" class="name reveal l2">Abdallah Elabd</text>
    <text x="64" y="228" class="line reveal l3">Freelance programmer since 2020</text>
    <text x="64" y="264" class="line reveal l4">Founder of 5+ startups · design · blockchain · marketing</text>
    <text x="64" y="320" class="prompt reveal l5">$ <tspan class="cmd">open abdallah.cv </tspan><tspan class="cursor">█</tspan></text>
  </g>
</svg>
